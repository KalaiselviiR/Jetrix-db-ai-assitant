<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Gemini DB Assistant</title>
  </head>
  <body>
    <h2>Ask Something About Your Database</h2>
    <textarea
      id="question"
      rows="4"
      cols="60"
      placeholder="Type your question..."
    ></textarea
    ><br />
    <button onclick="ask()">Ask Gemini</button>
    <h3>Response:</h3>
    <pre id="response"></pre>

    <script>
      async function ask() {
        const question = document.getElementById("question").value;
        const responseDiv = document.getElementById("response");

        try {
          const response = await fetch("/api/ask", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ question }),
          });

          if (!response.ok) {
            const errorData = await response.json();
            responseDiv.innerText = `Error: ${errorData.error}\nDetails: ${errorData.details}`;
            return;
          }

          const data = await response.json();
          responseDiv.innerText = `Response:\n${data.answer}`;
        } catch (err) {
          responseDiv.innerText = `Request failed: ${err.message}`;
        }
      }
    </script>
  </body>
</html>
